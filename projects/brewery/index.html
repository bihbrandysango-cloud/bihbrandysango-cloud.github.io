 share of 2019 profit, in percent","fix":"","sql":"SELECT months,\n       SUM(profit) AS monthly_profit,\n       ROUND(SUM(profit) / (SELECT SUM(profit) FROM breweries WHERE years = 2019) * 100, 2) AS profit_percentage\nFROM breweries\nWHERE years = 2019\nGROUP BY months\nORDER BY profit_percentage DESC;"},{"id":"A8","q":"Brand with the highest profit in Senegal","fix":"","sql":"SELECT brands, SUM(profit) AS total_profit\nFROM breweries\nWHERE countries = 'Senegal'\nGROUP BY brands\nORDER BY total_profit DESC\nLIMIT 1;"},{"id":"B1","q":"Top three brands consumed in the francophone countries, 2018 and 2019","fix":"Consumption is measured by quantity. The first version summed profit and grouped by year and country, so it returned three rows, not three brands.","sql":"SELECT brands, SUM(quantity) AS total_quantity\nFROM breweries\nWHERE countries IN ('Benin', 'Togo', 'Senegal')\n  AND years IN (2018, 2019)\nGROUP BY brands\nORDER BY total_quantity DESC\nLIMIT 3;"},{"id":"B2","q":"Top two consumer brands in Ghana","fix":"","sql":"SELECT brands, SUM(quantity) AS total_quantity\nFROM breweries\nWHERE countries = 'Ghana'\nGROUP BY brands\nORDER BY total_quantity DESC\nLIMIT 2;"},{"id":"B3","q":"Beers consumed in Nigeria (the most oil-rich country in West Africa), by year, over the three years","fix":"The first version also filtered on region = 'west', which dropped five of Nigeria's six regions.","sql":"SELECT brands, years,\n       SUM(quantity) AS total_consumed,\n       SUM(profit) AS total_profit\nFROM breweries\nWHERE countries = 'Nigeria'\n  AND brands IN ('budweiser', 'castle lite', 'eagle lager', 'trophy')\nGROUP BY brands, years\nORDER BY brands, years;"},{"id":"B4","q":"Favourite malt brand in the anglophone countries, 2018 and 2019","fix":"The first version spelled 'Nigeria' as 'Ngeria', so it only counted Ghana.","sql":"SELECT brands, SUM(quantity) AS total_quantity\nFROM breweries\nWHERE countries IN ('Nigeria', 'Ghana')\n  AND years IN (2018, 2019)\n  AND brands IN ('beta malt', 'grand malt', 'hero')\nGROUP BY brands\nORDER BY total_quantity DESC;"},{"id":"B5","q":"Brands that sold the most in Nigeria in 2019, by profit","fix":"","sql":"SELECT brands, SUM(profit) AS total_profit\nFROM breweries\nWHERE countries = 'Nigeria' AND years = 2019\nGROUP BY brands\nORDER BY total_profit DESC;"},{"id":"B6","q":"Favourite brand in Nigeria's south-south region, over all three years","fix":"The first version also grouped by year, so it returned one year's winner.","sql":"SELECT brands, SUM(quantity) AS total_quantity\nFROM breweries\nWHERE countries = 'Nigeria' AND region = 'southsouth'\nGROUP BY brands\nORDER BY total_quantity DESC\nLIMIT 1;"},{"id":"B7","q":"Beer consumption in Nigeria","fix":"","sql":"SELECT brands, SUM(quantity) AS total_consumed\nFROM breweries\nWHERE countries = 'Nigeria'\n  AND brands IN ('budweiser', 'castle lite', 'eagle lager', 'trophy')\nGROUP BY brands\nORDER BY total_consumed DESC;"},{"id":"B8","q":"Budweiser consumption by region in Nigeria","fix":"","sql":"SELECT region, SUM(quantity) AS total_quantity\nFROM breweries\nWHERE countries = 'Nigeria' AND brands = 'budweiser'\nGROUP BY region\nORDER BY total_quantity DESC;"},{"id":"B9","q":"Budweiser by region in Nigeria in 2019, to decide where to run a promotion","fix":"","sql":"SELECT region,\n       SUM(quantity) AS total_quantity,\n       SUM(profit) AS total_profit\nFROM breweries\nWHERE countries = 'Nigeria' AND years = 2019 AND brands = 'budweiser'\nGROUP BY region\nORDER BY total_quantity ASC;"},{"id":"C1","q":"Country with the highest beer consumption","fix":"The first version grouped by brand and country, so it returned the best single brand-country pair, not the best country.","sql":"SELECT countries, SUM(quantity) AS total_consumption\nFROM breweries\nWHERE brands IN ('budweiser', 'castle lite', 'eagle lager', 'trophy')\nGROUP BY countries\nORDER BY total_consumption DESC\nLIMIT 1;"},{"id":"C2","q":"Top sales representative for Budweiser in Senegal","fix":"","sql":"SELECT sales_rep, SUM(profit) AS total_profit\nFROM breweries\nWHERE countries = 'Senegal' AND brands = 'budweiser'\nGROUP BY sales_rep\nORDER BY total_profit DESC\nLIMIT 1;"},{"id":"C3","q":"Country with the highest profit in the fourth quarter of 2019","fix":"","sql":"SELECT countries, SUM(profit) AS total_profit\nFROM breweries\nWHERE years = 2019\n  AND months IN ('October', 'November', 'December')\nGROUP BY countries\nORDER BY total_profit DESC\nLIMIT 1;"}];

function spark(v,c){if(v.length<2)return'';const w=200,h=36,mn=Math.min(...v),mx=Math.max(...v),x=i=>2+i*(w-6)/(v.length-1),y=q=>h-4-(q-mn)/((mx-mn)||1)*(h-10),p=v.map((q,i)=>x(i).toFixed(1)+','+y(q).toFixed(1)).join(' ');

<div class="card"><h2>Territory split</h2><div class="cs">${esc(scope())}</div><div class="chart" id="c_te"></div><p class="take">${ter[0].p&&ter[1].p?`<b>Francophone leads ${pct(ter[0].p/P,0)} to ${pct(ter[1].p/P,0)}, with three countries against two.</b> Per country the two are much closer: ${money(ter[0].p/3)} and ${money(ter[1].p/2)}.`:''}</p></div></div>

/* ---------- SQL lab ---------- */
const lab={i:0,db:null,loading:null};
function loadScript(u){return new Promise((s,j)=>{const e=document.createElement('script');e.src=u;e.onload=s;e.onerror=()=>j(new Error('Could not load the SQL engine'));document.head.appendChild(e)})}
function getDb(){if(lab.db)return Promise.resolve(lab.db);if(lab.loading)return lab.loading;const B='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/';
lab.loading=loadScript(B+'sql-wasm.js').then(()=>initSqlJs({locateFile:f=>B+f})).then(SQL=>{const db=new SQL.Database();db.run('CREATE TABLE breweries (sales_id INTEGER, sales_rep TEXT, brands TEXT, plant_cost REAL, unit_price REAL, quantity INTEGER, costs REAL, profit REAL, countries TEXT, region TEXT, months TEXT, years INTEGER)');const st=db.prepare('INSERT INTO breweries VALUES (?,?,?,?,?,?,?,?,?,?,?,?)');db.run('BEGIN');RAW.rows.forEach(r=>st.run(r));db.run('COMMIT');st.free();lab.db=db;return db});return lab.loading}
const cellFmt=v=>v===null?'NULL':typeof v==='number'?(Number.isInteger(v)&&v>=3000||!Number.isInteger(v)?v.toLocaleString('en-US',{maximumFractionDigits:2}):String(v)):esc(v);
R.lab=()=>{const secs={A:'Profit analysis',B:'Brand analysis',C:'Country analysis'};return `<div class="lab-grid"><div class="card qlist" role="list">${Object.entries(secs).map(([s,t])=>`<div class="qh">${t}</div>`+Q.map((q,i)=>q.id[0]===s?`<button class="q ${i===lab.i?'on':''}" data-q="${i}" type="button"><b>${q.id}</b><span>${esc(q.q)}</span></button>`:'').join('')).join('')}</div>
<div class="card"><h2 id="qt"></h2><div class="cs">Edit the query if you like. It runs on the real table in your browser, and nothing is sent anywhere.</div><div id="qfix"></div><textarea id="sql" spellcheck="false" autocomplete="off" aria-label="SQL query"></textarea>
<div class="bar-run"><button class="run" id="run" type="button">▶ Run query</button><button class="reset" id="rst" type="button">Reset query</button><span class="meta" id="meta"></span></div><div id="out"></div>
<p class="hint">The table is <code>breweries</code>: sales_id, sales_rep, brands, plant_cost, unit_price, quantity, costs, profit, countries, region, months, years. These queries were written and checked on PostgreSQL 13. This lab runs them on SQLite in your browser, so PostgreSQL-only syntax won't work here. Press <code>Ctrl + Enter</code> to run.</p></div></div>`};
function pick(i){lab.i=i;const q=Q[i];qt.textContent=q.id+'. '+q.q;sql.value=q.sql;qfix.innerHTML=q.fix?`<div class="fix"><b>What I fixed:</b> ${esc(q.fix)}</div>`:'';document.querySelectorAll('.q').forEach(b=>b.classList.toggle('on',+b.dataset.q===i));runSql()}
async function runSql(){const o=out,m=meta,btn=run;btn.disabled=true;m.textContent='loading engine...';try{const db=await getDb();const t=performance.now();const res=db.exec(sql.value);const ms=performance.now()-t;if(!res.length){m.textContent='0 rows';o.innerHTML='<div class="hint">The query ran and returned no rows.</div>'}else{const r=res[res.length-1];m.textContent=`${r.values.length} row${r.values.length===1?'':'s'} in ${ms.toFixed(1)} ms`;o.innerHTML=`<div class="tw res"><table><thead><tr>${r.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${r.values.slice(0,500).map(v=>`<tr>${v.map(c=>`<td>${cellFmt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}}catch(e){m.textContent='';o.innerHTML=`<div class="err">${esc(e.message)}</div>`}btn.disabled=false}
R.lab.after=()=>{document.querySelectorAll('.q').forEach(b=>b.onclick=()=>pick(+b.dataset.q));run.onclick=runSql;rst.onclick=()=>pick(lab.i);sql.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();runSql()}};pick(lab.i)};
R.plan=()=>{const I=[['Profit is falling.','$38.5M in 2017, $37.1M in 2018 and $30.0M in 2019, down 22%. Units fell 16% and margin slipped from 44.2% to 42.7%.'],['Nigeria and Benin drove the 2019 drop.','Nigeria fell 44% from 2017 to 2019. Benin fell 33% from 2018 to 2019. Ghana held steady and led 2019 at $7.1M.'],['Two brands earn 63% of profit.','All seven brands sold about 125,000 to 129,000 units. Margin makes the difference: 60% for Castle Lite and 25% for Hero and Trophy.'],['Nigeria\'s two biggest beers fell hardest.','Budweiser units there dropped 54% from 2017 to 2019. Castle Lite dropped 74% from 2018 to 2019.'],['One rep carries a lot.','Jones earned $18.8M, 17.8% of all profit.']];
const P=[['h','HIGH','Investigate the 2019 decline, starting with Nigeria and Benin','Finds whether volume, price or competition caused a 22% fall in profit.'],['h','HIGH','Protect Castle Lite and Budweiser, especially in Nigeria','They earn 63% of profit, and their Nigerian volumes fell 54% to 74%.'],['','MEDIUM','Run the Budweiser promotion in north-central and south-south Nigeria','These regions had no 2019 sales and the lowest 2019 sales.'],['','MEDIUM','Review price and mix for Hero and Trophy','They sell as many units as the leaders at a 25% margin.'],['','MEDIUM','Plan 2020 by country, not by territory','Each country earns about $21M, so the territory gap is a head-count effect.'],['','LOW','Share the top rep\'s practice','One rep carries 17.8% of profit.']];
return `<div class="grid g2"><div class="card"><h2 style="margin-bottom:4px">What the data says</h2>${I.map((x,i)=>`<div class="rec"><div class="n">${i+1}</div><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}</div><div class="card"><h2 style="margin-bottom:4px">What to do next</h2>${P.map((x,i)=>`<div class="rec"><div class="n">${i+1}</div><div><h3>${x[2]}<span class="pri ${x[0]}">${x[1]}</span></h3><p>${x[3]}</p></div></div>`).join('')}</div></div>
<div class="card" style="margin-bottom:13px"><h2>Limits of this data</h2><p class="hs" style="margin-top:5px;line-height:1.6">Prices and plant costs never change, so margin is fixed by brand. The data shows what happened, not why, so competition or supply problems can't be ruled in or out. Region names repeat across all five countries, as they appear in the source.</p></div>`};
/* ---------- shell ---------- */
const FOOT=`<div class="pfoot"><span>West Africa Brewery Sales. Web version built with HTML, CSS and JavaScript by Bih Brandy Sango.</span><span><a href="https://github.com/bihbrandysango-cloud/west-africa-brewery-sql-analysis" target="_blank" rel="noopener">SQL and data on GitHub ↗</a><a href="../../projects.html">All projects</a></span></div>`;
nav.innerHTML=PAGES.map(p=>`<button class="nv" type="button" data-p="${p.id}"><svg viewBox="0 0 24 24" aria-hidden="true">${ic[p.i]}</svg>${p.n}${p.badge?`<span class="new">${p.badge}</span>`:''}</button>`).join('');
views.innerHTML=PAGES.map(p=>`<section class="view" id="v_${p.id}" aria-label="${p.t}"></section>`).join('');
const opt=(id,lab,list,val,disp=x=>x)=>`<select id="${id}" aria-label="${lab}" class="${val!=='all'?'set':''}"><option value="all">${lab}: all</option>${list.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(disp(x))}</option>`).join('')}</select>`;
function drawFilters(){const lab_=state.view==='lab'||state.view==='plan';filters.style.display=lab_?'none':'flex';if(lab_)return;
const cl=f.terr==='Anglophone'?ANG:f.terr==='Francophone'?FRA:[...ANG,...FRA],bl=f.type==='Beer'?BEERS:f.type==='Malt'?MALTS:[...BEERS,...MALTS];
filters.innerHTML=`<div class="pills" role="group" aria-label="Year">${['all',...YEARS].map(y=>`<button type="button" data-y="${y}" class="${String(f.year)===String(y)?'on':''}" aria-pressed="${String(f.year)===String(y)}">${y==='all'?'All years':y}</button>`).join('')}</div>${opt('s_terr','Territory',['Anglophone','Francophone'],f.terr)}${opt('s_country','Country',cl,f.country)}${opt('s_type','Type',['Beer','Malt'],f.type)}${opt('s_brand','Brand',bl,f.brand,tc)}${opt('s_rep','Rep',[...new Set(ROWS.map(r=>r.sales_rep))].sort(),f.rep)}<button id="clear" type="button" style="display:${active()?'inline':'none'}">Clear filters</button>`;
filters.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{f.year=b.dataset.y;render()});
[['s_terr','terr'],['s_country','country'],['s_type','type'],['s_brand','brand'],['s_rep','rep']].forEach(([id,k])=>document.getElementById(id).onchange=e=>{f[k]=e.target.value;if(k==='terr'&&f.country!=='all'&&f.terr!=='all'&&!(f.terr==='Anglophone'?ANG:FRA).includes(f.country))f.country='all';if(k==='type'&&f.brand!=='all'&&f.type!=='all'&&!(f.type==='Beer'?BEERS:MALTS).includes(f.brand))f.brand='all';render()});
clear.onclick=clearF}
function clearF(){Object.keys(f).forEach(k=>f[k]='all');render()}
function render(){const p=PAGES.find(x=>x.id===state.view);h.textContent=p.t;hs.textContent=p.s;nav.querySelectorAll('.nv').forEach(b=>{const on=b.dataset.p===p.id;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v_'+p.id));drawFilters();
document.querySelectorAll('.view').forEach(v=>{if(v.id!=='v_'+p.id)v.innerHTML=''});const v=document.getElementById('v_'+p.id);v.innerHTML=R[p.id]()+FOOT;const c=document.getElementById('clr2');if(c)c.onclick=clearF;if(R[p.id].after)R[p.id].after()}
nav.onclick=e=>{const b=e.target.closest('.nv');if(!b)return;state.view=b.dataset.p;history.replaceState(null,'','#'+state.view);render();scrollTo(0,0)};
const tog=el=>{const k=el.dataset.f,v=el.dataset.v;f[k]=f[k]===v?'all':v;render()};
views.addEventListener('click',e=>{const el=e.target.closest('[data-f]');if(el)tog(el)});views.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('[data-f]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tog(el)}});
const start=location.hash.slice(1);if(PAGES.some(p=>p.id===start))state.view=start;
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.innerHTML=t.getAttribute('data-tip');tip.style.opacity=1;const r=tip.getBoundingClientRect();tip.style.left=Math.min(e.clientX+14,innerWidth-r.width-8)+'px';tip.style.top=Math.max(e.clientY-r.height-12,8)+'px'});
let rt,lw=innerWidth;addEventListener('resize',()=>{if(innerWidth===lw)return;lw=innerWidth;clearTimeout(rt);rt=setTimeout(render,120)});
render();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(state.view!=='lab')render()});
