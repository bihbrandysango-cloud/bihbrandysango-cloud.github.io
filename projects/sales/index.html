R.plan=()=>{const I=[['The year missed target by 8.8%.','Revenue of $985K against a $1.08M target. Only 4 of 12 months reached their number: January, July, October and December.'],['Export is over half the business.','Export delivered $532K, 54% of revenue, across 14 countries.'],['India is the single biggest exposure.','India contributed $453K, 46% of revenue. Pakistan is next at under 8%.'],['Customers are moderately concentrated.','The top 10 of 40 customers make 41.6% of revenue, and the largest makes 6.2%.'],['Midyear is where the gap opened.','April to September averaged $75K a month against a $92K target. Five of those six months missed, and only July hit.']];const P=[['h','HIGH','Find out why April to September fell short','Five of those six months missed target, and they opened most of the $95K gap.'],['h','HIGH','Build a retention plan for the top 10 customers','They make 41.6% of revenue, so active account management protects a large share.'],['','MEDIUM','Reduce reliance on India','One country makes 46% of revenue, while no export market reaches 8%.'],['','MEDIUM','Review how monthly targets are set','Q4 targets are 17% lower than Q1\'s, which made Q4 look like the only strong quarter.'],['','LOW','Add margin data','Revenue alone can\'t show which customers and products are truly profitable.']];
return `<div class="grid g2"><div class="card"><h2 style="margin-bottom:4px">What the year says</h2>${I.map((x,i)=>`<div class="rec"><div class="n">${i+1}</div><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}</div><div class="card"><h2 style="margin-bottom:4px">What to do next</h2>${P.map((x,i)=>`<div class="rec"><div class="n">${i+1}</div><div><h3>${x[2]}<span class="pri ${x[0]}">${x[1]}</span></h3><p>${x[3]}</p></div></div>`).join('')}</div></div><div class="card" style="margin-bottom:13px"><h2>Limits of this data</h2><p class="hs" style="margin-top:5px;line-height:1.6">The dataset is synthetic, so treat this as a demonstration of the analysis. It has no margin data, so it shows revenue, not profit. It covers one year, so seasonality and year-on-year change can't be separated.</p></div>`};
const FOOT=`<div class="pfoot"><span>Sales vs Target. Web version built with HTML, CSS and JavaScript by Bih Brandy Sango, from a synthetic dataset.</span><span><a href="https://github.com/bihbrandysango-cloud/Sales-Analysis-Excel" target="_blank" rel="noopener">Excel workbook on GitHub ↗</a><a href="../../projects.html">All projects</a></span></div>`;
nav.innerHTML=PAGES.map(p=>`<button class="nv" type="button" data-p="${p.id}"><svg viewBox="0 0 24 24" aria-hidden="true">${ic[p.i]}</svg>${p.n}${p.badge?`<span class="new">${p.badge}</span>`:''}</button>`).join('');
views.innerHTML=PAGES.map(p=>`<section class="view" id="v_${p.id}" aria-label="${p.t}"></section>`).join('');
const opt=(id,lab,list,val)=>`<select id="${id}" aria-label="${lab}" class="${val!=='all'?'set':''}"><option value="all">${lab}: all</option>${list.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
function drawFilters(){const hide=state.view==='plan'||state.view==='risk';filters.style.display=hide?'none':'flex';if(hide)return;const cl=f.region==='all'?COUN:f.region==='Export'?COUN.filter(c=>c!=='India'):['India'];filters.innerHTML=`<div class="pills" role="group" aria-label="Period">${['all','Q1','Q2','Q3','Q4',...MN].map(m=>`<button type="button" data-m="${m}" class="${f.month===m?'on':''}" aria-pressed="${f.month===m}">${m==='all'?'Year':m}</button>`).join('')}</div>${opt('s_r','Region',REG,f.region)}${opt('s_c','Country',cl,f.country)}${opt('s_cu','Customer',Array.from({length:40},(_,i)=>CUST(i+1)),f.cust)}${opt('s_p','Product',[...new Set(ROWS.map(r=>r.p))].sort((a,b)=>a-b).map(PROD),f.prod)}${active()?'<button id="clear" type="button">Clear filters</button>':''}`;filters.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{f.month=b.dataset.m;render()});[['s_r','region'],['s_c','country'],['s_cu','cust'],['s_p','prod']].forEach(([id,k])=>document.getElementById(id).onchange=e=>{f[k]=e.target.value;fix(k);render()});const c=document.getElementById('clear');if(c)c.onclick=clearF}
function fix(k){if(k==='region'&&f.country!=='all'){if(f.region==='Export'&&f.country==='India')f.country='all';else if(f.region!=='Export'&&f.region!=='all'&&f.country!=='India')f.country='all'}}
function clearF(){Object.keys(f).forEach(k=>f[k]='all');render()}
function render(){const p=PAGES.find(x=>x.id===state.view);h.textContent=p.t;hs.textContent=p.s;nav.querySelectorAll('.nv').forEach(b=>{const on=b.dataset.p===p.id;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});document.querySelectorAll('.view').forEach(v=>{const on=v.id==='v_'+p.id;v.classList.toggle('on',on);if(!on)v.innerHTML=''});drawFilters();const v=document.getElementById('v_'+p.id);v.innerHTML=R[p.id]()+FOOT;const c=document.getElementById('clr2');if(c)c.onclick=clearF;if(R[p.id].after)R[p.id].after()}
nav.onclick=e=>{const b=e.target.closest('.nv');if(!b)return;state.view=b.dataset.p;history.replaceState(null,'','#'+state.view);render();scrollTo(0,0)};
const tog=el=>{const k=el.dataset.f,v=el.dataset.v;f[k]=f[k]===v?'all':v;fix(k);render()};
views.addEventListener('click',e=>{const el=e.target.closest('[data-f]');if(el)tog(el)});views.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('[data-f]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tog(el)}});
const start=location.hash.slice(1);if(PAGES.some(p=>p.id===start))state.view=start;
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.innerHTML=t.getAttribute('data-tip');tip.style.opacity=1;const r=tip.getBoundingClientRect();tip.style.left=Math.min(e.clientX+14,innerWidth-r.width-8)+'px';tip.style.top=Math.max(e.clientY-r.height-12,8)+'px'});
let rt,lw=main.clientWidth;new ResizeObserver(()=>{if(main.clientWidth===lw)return;lw=main.clientWidth;clearTimeout(rt);rt=setTimeout(render,120)}).observe(main);render();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
