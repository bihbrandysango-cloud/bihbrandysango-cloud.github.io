R.clinical=()=>{const r=CUR;if(!r.n)return EMPTY;const metric=state.heat,val=(d,t)=>metric==='cost'?r.hc[d][t]:metric==='visits'?r.hv[d][t]:(r.hv[d][t]?r.hc[d][t]/r.hv[d][t]:0),ds=DIM.diag.map((n,i)=>i).filter(i=>r.dv[i]>0),ts=DIM.treat.map((n,i)=>i).filter(i=>r.tv[i]>0),all=ds.flatMap(d=>ts.map(t=>val(d,t))).filter(v=>v>0),mn=Math.min(...all),mx=Math.max(...all),show=v=>metric==='cost'?money(v):metric==='visits'?num(v):usd(v);const col=v=>{const q=(v-mn)/((mx-mn)||1),a=[232,241,238],b=[15,76,69],c=a.map((x,i)=>Math.round(x+(b[i]-x)*q));return{bg:`rgb(${c})`,fg:q>.55?'#fff':'#14302B'}};
