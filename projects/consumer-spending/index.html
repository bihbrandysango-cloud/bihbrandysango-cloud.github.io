<script>
const {REG,CTY,CR,SEG,PRI,YR,INC,EXP,R:RAW}=window.D;const N=RAW.length/6;
const SHORT={'Middle East and North Africa':'Middle East & N. Africa','Central America and the Caribbean':'C. America & Caribbean','Australia and Oceania':'Australia & Oceania'};const sr=n=>SHORT[n]||n;const sum=a=>a.reduce((x,y)=>x+y,0);
const money=(v,d=1)=>{const a=Math.abs(v),n=v<0?'-':'';return a>=1e9?n+'$'+(a/1e9).toFixed(d)+'B':a>=1e6?n+'$'+(a/1e6).toFixed(d)+'M':a>=1e3?n+'$'+(a/1e3).toFixed(0)+'K':n+'$'+a.toFixed(a<100&&a%1?2:0)};
const per=v=>'$'+(v>=100?v.toFixed(0):v.toFixed(2));const num=v=>Math.round(v).toLocaleString('en-US');const big=v=>v>=1e9?(v/1e9).toFixed(2)+'B':v>=1e6?(v/1e6).toFixed(1)+'M':num(v);const pct=(v,d=1)=>(v*100).toFixed(d)+'%';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const f={year:'all',region:'all',seg:'all',pri:'all',country:'all'};const state={view:'overview',sort:'inc',q:''};
const idx=(l,v)=>v==='all'?-1:l.indexOf(v);
/* every row is country, segment, priority, year, records, samples. Money = samples x the segment's fixed amount per person */
function scan(fn,o={}){const y=o.noYear?-1:idx(YR,f.year===('all')?'all':+f.year),r=idx(REG,f.region),s=o.noSeg?-1:idx(SEG,f.seg),p=idx(PRI,f.pri),c=idx(CTY,f.country);
for(let i=0;i<RAW.length;i+=6){const ci=RAW[i],si=RAW[i+1],pi=RAW[i+2],yi=RAW[i+3];if(y>=0&&yi!==y)continue;if(s>=0&&si!==s)continue;if(p>=0&&pi!==p)continue;if(c>=0&&ci!==c)continue;if(r>=0&&CR[ci]!==r)continue;fn(ci,si,pi,yi,RAW[i+4],RAW[i+5])}}
function by(key,o){const m=new Map();scan((c,s,p,y,rec,n)=>{const k=key(c,s,p,y);let a=m.get(k);if(!a){a={k,rec:0,n:0,inc:0,exp:0};m.set(k,a)}a.rec+=rec;a.n+=n;a.inc+=n*INC[s];a.exp+=n*EXP[s]},o);return [...m.values()]}
const total=o=>{const t={rec:0,n:0,inc:0,exp:0};scan((c,s,p,y,rec,n)=>{t.rec+=rec;t.n+=n;t.inc+=n*INC[s];t.exp+=n*EXP[s]},o);return t};
const active=()=>Object.values(f).some(v=>v!=='all');
const scope=()=>{const p=[];if(f.seg!=='all')p.push(f.seg);if(f.country!=='all')p.push('in '+f.country);else if(f.region!=='all')p.push('in '+f.region);if(f.pri!=='all')p.push('priority '+f.pri);if(f.year!=='all')p.push(f.year);return p.join(', ')||'All records'};
/* charts */
const svg=(w,h,inner,l)=>`<svg viewBox="0 0 ${w} ${h}" height="${h}" role="img" aria-label="${esc(l)}">${inner}</svg>`;
function spark(v,c){if(v.length<2)return'<div style="height:39px"></div>';const w=200,h=32,mn=Math.min(...v),mx=Math.max(...v),x=i=>2+i*(w-6)/(v.length-1),y=q=>h-4-(q-mn)/((mx-mn)||1)*(h-10),p=v.map((q,i)=>x(i).toFixed(1)+','+y(q).toFixed(1)).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="${x(0)},${h} ${p} ${x(v.length-1)},${h}" fill="${c}" opacity=".13"/><polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`}
function bars(el,rows,{fmt=money,lw=130,rh=31,field}={}){const w=Math.max(el.clientWidth,280),small=w<420,LW=small?Math.min(lw,lw>140?140:102):lw,R=64,h=rows.length*rh+4,mx=Math.max(...rows.map(r=>r.v),1e-9),X=v=>LW+v/mx*(w-LW-R),cut=s=>s.length>(small&&lw<=140?15:24)?s.slice(0,small&&lw<=140?14:23)+'…':s;let g='';rows.forEach((r,i)=>{const y=2+i*rh,bh=rh-11,on=field&&f[field]===r.key;g+=`<g class="${field?'clk ':''}${on?'sel':''}" ${field?`data-f="${field}" data-v="${esc(r.key)}" tabindex="0" role="button" aria-pressed="${!!on}"`:''} data-tip="${esc(r.tip||r.l+': '+fmt(r.v))}"><rect x="0" y="${y-3}" width="${w}" height="${rh}" fill="transparent"/><text class="lab" x="${LW-9}" y="${y+bh/2+4}" text-anchor="end">${esc(cut(r.l))}</text><rect class="bar" x="${LW}" y="${y}" width="${Math.max(X(r.v)-LW,1.5)}" height="${bh}" rx="4" fill="${r.c||'var(--blue)'}"/><text class="val" x="${X(r.v)+7}" y="${y+bh/2+4}">${fmt(r.v)}</text></g>`});el.innerHTML=svg(w,h,g,'Bar chart')}
function cols(el,rows,{h=205,fmt=money}={}){const w=Math.max(el.clientWidth,280),T=20,B=24,step=(w-10)/rows.length,bw=Math.min(step*.66,48),mx=Math.max(...rows.map(r=>r.v),1e-9),Y=v=>T+(1-v/mx)*(h-T-B);let g='';rows.forEach((r,i)=>{const cx=5+step*(i+.5),on=f.year===String(r.l);g+=`<g class="clk ${on?'sel':''}" data-f="year" data-v="${r.l}" tabindex="0" role="button" data-tip="${esc(r.tip)}"><rect x="${cx-step/2}" y="0" width="${step}" height="${h}" fill="transparent"/><rect class="bar" x="${cx-bw/2}" y="${Y(r.v)}" width="${bw}" height="${Math.max(h-B-Y(r.v),1)}" rx="4" fill="${r.c}"/>${step>34?`<text class="val" x="${cx}" y="${Y(r.v)-6}" text-anchor="middle" style="font-size:10.5px">${fmt(r.v)}</text>`:''}<text class="${on?'lab':'axis'}" x="${cx}" y="${h-7}" text-anchor="middle">${r.l}</text></g>`});el.innerHTML=svg(w,h,g,'Income by year')}
function ramp(t){const a=[201,214,240],b=[27,42,99],c=a.map((x,i)=>Math.round(x+(b[i]-x)*t));return `rgb(${c})`}
function squarify(items,x,y,w,h){const out=[];let list=items.slice();const totalv=sum(list.map(i=>i.v));const scale=w*h/totalv;list=list.map(i=>({...i,a:i.v*scale}));
const worst=(row,s)=>{const t=sum(row.map(r=>r.a)),mx=Math.max(...row.map(r=>r.a)),mn=Math.min(...row.map(r=>r.a));return Math.max(s*s*mx/(t*t),t*t/(s*s*mn))};
while(list.length){const s=Math.min(w,h);let row=[list[0]],k=1;while(k<list.length&&worst([...row,list[k]],s)<=worst(row,s)){row.push(list[k]);k++}const t=sum(row.map(r=>r.a));if(w>=h){const cw=t/h;let cy=y;row.forEach(r=>{out.push({...r,x,y:cy,w:cw,h:r.a/cw});cy+=r.a/cw});x+=cw;w-=cw}else{const ch=t/w;let cx=x;row.forEach(r=>{out.push({...r,x:cx,y,w:r.a/ch,h:ch});cx+=r.a/ch});y+=ch;h-=ch}list=list.slice(k)}return out}

/* shell */
const FOOT=`<div class="pfoot"><span>Consumer Spending Power. Web version built with HTML, CSS and JavaScript by Bih Brandy Sango.</span><span><a href="https://github.com/bihbrandysango-cloud/credpal-consumer-spending-tableau" target="_blank" rel="noopener">Tableau workbook on GitHub ↗</a><a href="../../projects.html">All projects</a></span></div>`;
nav.innerHTML=PAGES.map(p=>`<button class="nv" type="button" data-p="${p.id}"><svg viewBox="0 0 24 24" aria-hidden="true">${ic[p.i]}</svg>${p.n}${p.badge?`<span class="new">${p.badge}</span>`:''}</button>`).join('');
views.innerHTML=PAGES.map(p=>`<section class="view" id="v_${p.id}" aria-label="${p.t}"></section>`).join('');
const opt=(id,lab,list,val)=>`<select id="${id}" aria-label="${lab}" class="${val!=='all'?'set':''}"><option value="all">${lab}: all</option>${list.map(x=>`<option value="${esc(x)}" ${String(x)===String(val)?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
function drawFilters(){const hide=state.view==='plan';filters.style.display=hide?'none':'flex';if(hide)return;const cl=CTY.filter((c,i)=>f.region==='all'||REG[CR[i]]===f.region);
filters.innerHTML=`<div class="pills" role="group" aria-label="Year">${['all',...YR].map(y=>`<button type="button" data-y="${y}" class="${String(f.year)===String(y)?'on':''}" aria-pressed="${String(f.year)===String(y)}">${y==='all'?'All':y}</button>`).join('')}</div>${opt('s_region','Region',REG,f.region)}${opt('s_country','Country',cl,f.country)}${opt('s_seg','Segment',SEG,f.seg)}${opt('s_pri','Priority',PRI,f.pri)}${active()?'<button id="clear" type="button">Clear filters</button>':''}`;
filters.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{f.year=b.dataset.y;render()});[['s_region','region'],['s_country','country'],['s_seg','seg'],['s_pri','pri']].forEach(([id,k])=>document.getElementById(id).onchange=e=>{f[k]=e.target.value;if(k==='region'&&f.country!=='all'&&f.region!=='all'&&REG[CR[CTY.indexOf(f.country)]]!==f.region)f.country='all';render()});const c=document.getElementById('clear');if(c)c.onclick=clearF}
function clearF(){Object.keys(f).forEach(k=>f[k]='all');render()}
function render(){const p=PAGES.find(x=>x.id===state.view);h.textContent=p.t;hs.textContent=p.s;nav.querySelectorAll('.nv').forEach(b=>{const on=b.dataset.p===p.id;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});document.querySelectorAll('.view').forEach(v=>{const on=v.id==='v_'+p.id;v.classList.toggle('on',on);if(!on)v.innerHTML=''});drawFilters();const v=document.getElementById('v_'+p.id);v.innerHTML=R[p.id]()+FOOT;const c=document.getElementById('clr2');if(c)c.onclick=clearF;if(R[p.id].after)R[p.id].after()}
nav.onclick=e=>{const b=e.target.closest('.nv');if(!b)return;state.view=b.dataset.p;history.replaceState(null,'','#'+state.view);render();scrollTo(0,0)};
const tog=el=>{const k=el.dataset.f,v=el.dataset.v;f[k]=f[k]===v?'all':v;if(k==='region'&&f.country!=='all'&&f.region!=='all'&&REG[CR[CTY.indexOf(f.country)]]!==f.region)f.country='all';render()};
views.addEventListener('click',e=>{const el=e.target.closest('[data-f]');if(el)tog(el)});views.addEventListener('keydown',e=>{if(e.target.id==='search')return;const el=e.target.closest&&e.target.closest('[data-f]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tog(el)}});
const start=location.hash.slice(1);if(PAGES.some(p=>p.id===start))state.view=start;
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.innerHTML=t.getAttribute('data-tip');tip.style.opacity=1;const r=tip.getBoundingClientRect();tip.style.left=Math.min(e.clientX+14,innerWidth-r.width-8)+'px';tip.style.top=Math.max(e.clientY-r.height-12,8)+'px'});
let rt,lw=innerWidth;addEventListener('resize',()=>{if(innerWidth===lw)return;lw=innerWidth;clearTimeout(rt);rt=setTimeout(render,120)});render();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());
</script>
</body>
</html>
